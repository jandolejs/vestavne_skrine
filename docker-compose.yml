services:

    frontend:
        container_name: vestavne_skrine_frontend
        build:
            context: .
            platforms:
                - linux/amd64
        image: ghcr.io/jandolejs/vestavne_skrine:latest
        ports:
            - 8078:80
        environment:
            BASE_URL: nabytek.jandolejs.cz
        restart: unless-stopped
