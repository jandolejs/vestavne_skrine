services:
  php:
    container_name: vestavne_skrine_frontend
    image: vestavne_skrine:dev
    build:
      context: .
      platforms:
        - linux/amd64
    environment:
      DEBUG: tracy
      APP_DEBUG: 1
      TZ: Europe/Prague
    ports:
      - "8078:80"
    volumes:
      - ./src:/var/www/html/www
